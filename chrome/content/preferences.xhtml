<linkset xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
         xmlns:html="http://www.w3.org/1999/xhtml">
  <html:link rel="localization" href="mindflow.ftl" />
</linkset>
<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      id="mindflow-preferences-pane" class="mindflow-prefs-container"
      onload="MindFlow_Preferences.init(window)">
  <html:header class="mindflow-pref-header">
    <html:div class="mindflow-pref-identity">
      <html:div class="mindflow-pref-title-area">
        <html:img class="mindflow-pref-brand-icon" src="chrome://mindflow/content/icons/icon-accent.svg" width="22" height="22" alt="" />
        <html:h1 class="mindflow-pref-title" data-l10n-id="mindflow-pref-title"></html:h1>
        <html:span class="mindflow-pref-version" data-l10n-id="mindflow-pref-version" data-l10n-args='{"version":"16.2.0"}'></html:span>
      </html:div>
      <html:p id="mindflow-pref-status" class="mindflow-pref-status" role="status" aria-live="polite" data-l10n-id="mindflow-pref-status-checking"></html:p>
    </html:div>
    <html:button id="mindflow-btn-open-workspace" class="mindflow-btn-primary" type="button" data-l10n-id="mindflow-pref-btn-open-workspace"></html:button>
  </html:header>

  <html:details class="mindflow-setting-card" open="open">
    <html:summary class="mindflow-card-summary"><html:h2 class="mindflow-card-title" data-l10n-id="mindflow-pref-group-workspace"></html:h2></html:summary>
    <html:div class="mindflow-card-body">
      <html:div id="mindflow-pref-literature" class="mindflow-pref-content" />
      <html:h3 class="mindflow-subhead" data-l10n-id="mindflow-pref-subhead-interface"></html:h3>
      <html:div id="mindflow-pref-interface" class="mindflow-pref-content" />
    </html:div>
  </html:details>

  <html:details class="mindflow-setting-card">
    <html:summary class="mindflow-card-summary"><html:h2 class="mindflow-card-title" data-l10n-id="mindflow-pref-group-ai-sync"></html:h2></html:summary>
    <html:div class="mindflow-card-body">
      <html:div id="mindflow-pref-ai" class="mindflow-pref-content" />
      <html:h3 class="mindflow-subhead" data-l10n-id="mindflow-pref-subhead-backup"></html:h3>
      <html:div id="mindflow-pref-backup" class="mindflow-pref-content" />
      <html:h3 class="mindflow-subhead" data-l10n-id="mindflow-pref-subhead-webdav"></html:h3>
      <html:div id="mindflow-pref-webdav" class="mindflow-pref-content" />
    </html:div>
  </html:details>

  <html:details class="mindflow-setting-card mindflow-pref-group-last">
    <html:summary class="mindflow-card-summary"><html:h2 class="mindflow-card-title" data-l10n-id="mindflow-pref-group-editing-shortcuts"></html:h2></html:summary>
    <html:div class="mindflow-card-body">
      <html:div id="mindflow-pref-editing" class="mindflow-pref-content" />
      <html:h3 class="mindflow-subhead" data-l10n-id="mindflow-pref-subhead-shortcuts"></html:h3>
      <html:div id="mindflow-pref-shortcuts" class="mindflow-pref-content">
        <html:div class="mindflow-shortcuts-grid">
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd" data-l10n-id="mindflow-pref-key-0"></html:kbd>
            <html:span class="mindflow-shortcut-label" data-l10n-id="mindflow-pref-shortcut-child"></html:span>
          </html:div>
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd" data-l10n-id="mindflow-pref-key-1"></html:kbd>
            <html:span class="mindflow-shortcut-label" data-l10n-id="mindflow-pref-shortcut-sibling"></html:span>
          </html:div>
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd" data-l10n-id="mindflow-pref-key-2"></html:kbd>
            <html:span class="mindflow-shortcut-label" data-l10n-id="mindflow-pref-shortcut-edit"></html:span>
          </html:div>
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd" data-l10n-id="mindflow-pref-key-3"></html:kbd>
            <html:span class="mindflow-shortcut-label" data-l10n-id="mindflow-pref-shortcut-delete"></html:span>
          </html:div>
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd" data-l10n-id="mindflow-pref-key-4"></html:kbd>
            <html:span class="mindflow-shortcut-label" data-l10n-id="mindflow-pref-shortcut-toggle"></html:span>
          </html:div>
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd" data-l10n-id="mindflow-pref-key-5"></html:kbd>
            <html:span class="mindflow-shortcut-label" data-l10n-id="mindflow-pref-shortcut-levels"></html:span>
          </html:div>
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd" data-l10n-id="mindflow-pref-key-6"></html:kbd>
            <html:span class="mindflow-shortcut-label" data-l10n-id="mindflow-pref-shortcut-replace"></html:span>
          </html:div>
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd" data-l10n-id="mindflow-pref-key-7"></html:kbd>
            <html:span class="mindflow-shortcut-label" data-l10n-id="mindflow-pref-shortcut-help"></html:span>
          </html:div>
        </html:div>
        <html:div class="mindflow-form-row" style="margin-top: 10px; border-bottom: none;">
          <html:div class="mindflow-form-label-wrap">
            <html:span class="mindflow-form-label" data-l10n-id="mindflow-pref-reset-label"></html:span>
            <html:span class="mindflow-form-desc" data-l10n-id="mindflow-pref-reset-desc"></html:span>
          </html:div>
          <html:button id="mindflow-btn-reset-defaults" class="mindflow-btn-secondary" type="button" data-l10n-id="mindflow-pref-reset-btn"></html:button>
        </html:div>
      </html:div>
    </html:div>
  </html:details>

  <html:footer class="mindflow-pref-release" data-l10n-id="mindflow-pref-release-aria">
    <html:h2 class="mindflow-pref-release-title" data-l10n-id="mindflow-pref-release-section-title"></html:h2>
    <html:p><html:span class="mindflow-pref-release-label" data-l10n-id="mindflow-pref-release-notes-label"></html:span><html:a href="https://github.com/groele/Zotero-MindFlow/releases/tag/v16.2.0" target="_blank" rel="noopener noreferrer" data-l10n-id="mindflow-pref-release-notes-text"></html:a></html:p>
    <html:p><html:span class="mindflow-pref-release-label" data-l10n-id="mindflow-pref-release-date-label"></html:span><html:span data-l10n-id="mindflow-pref-release-date"></html:span></html:p>
    <html:p><html:span class="mindflow-pref-release-label" data-l10n-id="mindflow-pref-release-current-label"></html:span><html:a href="https://github.com/groele/Zotero-MindFlow/releases/download/v16.2.0/zotero-mindflow-16.2.0.xpi" target="_blank" rel="noopener noreferrer" data-l10n-id="mindflow-pref-release-xpi"></html:a></html:p>
    <html:p><html:span class="mindflow-pref-release-label" data-l10n-id="mindflow-pref-release-repo-label"></html:span><html:a href="https://github.com/groele/Zotero-MindFlow" target="_blank" rel="noopener noreferrer" data-l10n-id="mindflow-pref-release-repo"></html:a></html:p>
  </html:footer>
</vbox>
